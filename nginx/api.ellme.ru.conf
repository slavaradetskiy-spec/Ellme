# =========================================================================
# Reverse proxy: https://api.ellme.ru -> https://lcyrguguhiutdvdkptbs.supabase.co
#
# Why: supabase.co is intermittently blocked from Russian ISPs. Hosting this
# proxy on a Russian VDS lets clients reach Supabase (Auth, REST, Storage,
# Realtime, Functions) without a VPN.
#
# Set NEXT_PUBLIC_SUPABASE_URL=https://api.ellme.ru in Vercel after deploy.
# The Supabase anon key is unchanged.
#
# Deployment: see nginx/README.md
# =========================================================================

# Map Connection header for WebSocket upgrade (used by /realtime/v1/*).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keepalive pool to the upstream — avoids re-handshaking TLS on every request.
upstream supabase_upstream {
    server lcyrguguhiutdvdkptbs.supabase.co:443;
    keepalive 32;
}

# --- HTTP -> HTTPS redirect (also serves ACME challenges) -----------------
server {
    listen 80;
    listen [::]:80;
    server_name api.ellme.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS proxy ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ellme.ru;

    # Issued by certbot --nginx -d api.ellme.ru
    ssl_certificate     /etc/letsencrypt/live/api.ellme.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ellme.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Storage uploads (compressed meal photos can be a few MB; raw camera
    # uploads in the Telegram-style chat are sent as-is).
    client_max_body_size 50m;
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    # Slow-network safety: allow long-lived connections for big uploads
    # and Realtime websockets.
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # Supabase routes its REST/Auth/Storage/Realtime/Functions all under
    # the same hostname, so a single catch-all `/` is enough.
    location / {
        proxy_pass https://supabase_upstream;

        # SNI + Host: Supabase's edge needs the original *.supabase.co Host
        # for routing AND a matching SNI for the upstream certificate.
        proxy_ssl_server_name on;
        proxy_ssl_name        lcyrguguhiutdvdkptbs.supabase.co;
        proxy_set_header      Host lcyrguguhiutdvdkptbs.supabase.co;

        # Pass through everything else verbatim — Supabase auth uses the
        # `apikey` and `Authorization` headers; PostgREST uses `Prefer`.
        proxy_pass_request_headers on;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /realtime/v1/websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep upstream connections warm for the keepalive pool above.
        proxy_set_header Connection "";

        # Don't let nginx buffer large storage downloads to disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
